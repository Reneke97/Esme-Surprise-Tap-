<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;

  h1 { margin: 14px 0 8px; font-size: clamp(28px, 7vw, 38px); }
  .sub { color: #6b7280; margin: 0 auto 24px; line-height: 1.5; }
  .result {
    min-height: 180px; display: grid; place-items: center; border: 2px dashed #bbd8c3;
    border-radius: 20px; padding: 24px; margin: 22px 0; background: #fbfffc;
  }
  .result h2 { margin: 0 0 12px; font-size: 24px; }
  .result p { margin: 0; font-size: 18px; line-height: 1.55; }
  .small { margin-top: 18px; color: #9ca3af; font-size: 12px; }
  .spin { animation: pop .45s ease; }
  @keyframes pop { 0% { transform: scale(.96); opacity: .25; } 100% { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

document.getElementById('count').textContent = surprises.length;
let last = -1;

function reveal() {
  let i;
  do {
    i = Math.floor(Math.random() * surprises.length);
  } while (surprises.length > 1 && i === last);

  last = i;
  const [heading, message] = surprises[i];
  const result = document.getElementById('result');
  result.classList.remove('spin');
  void result.offsetWidth;
  result.classList.add('spin');
  result.innerHTML = `<div><h2>${heading}</h2><p>${message}</p></div>`;
}

window.addEventListener('load', () => {
  window.setTimeout(reveal, 500);
});
